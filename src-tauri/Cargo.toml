[package]
name = "codelens"
version = "0.1.0"
description = "CodeLens - see the AI's reasoning in real time"
edition = "2021"

# The `crate-type` 128 bit library is required for mobile; ignored on desktop.
[lib]
name = "codelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
futures-util = "0.3"
# Per-OS credential store: Keychain (macOS), Credential Manager (Windows) and
# the D-Bus Secret Service / libsecret (Linux). Without the `sync-secret-service`
# feature keyring silently falls back to an in-memory `mock` store on Linux,
# which would make saved API keys vanish on the next launch.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.17"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
