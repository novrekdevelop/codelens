name: release

# Builds installers for Windows, macOS and Linux and attaches them to a
# GitHub Release. Trigger it by pushing a tag named `v*` (e.g. `v0.1.0`),
# or run it manually from the Actions tab to test the pipeline.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: "dmg"
          - platform: ubuntu-22.04
            bundles: "deb,appimage"
          - platform: windows-latest
            bundles: "nsis,msi"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Frontend type-check + build
        run: npm run build

      - name: Rust tests (parser / SSE / providers)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Tauri bundle
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true